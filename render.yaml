# Render Blueprint — LGS Tech API (backend/new)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy from Render Dashboard → New → Blueprint
# (or create a Web Service manually using the settings below)

services:
  - type: web
    name: lgs-tech-api
    runtime: node
    plan: free
    rootDir: backend/new
    buildCommand: npm install
    # Pre-Deploy is not available on the free plan. Paid plans can optionally
    # use preDeployCommand (db:setup) and startCommand: npm start.
    # No users are seeded here: demo accounts must not exist in production.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
