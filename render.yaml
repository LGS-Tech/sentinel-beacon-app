# Render Blueprint — LGS Tech API (backend/new)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lgs-tech-api
    runtime: node
    plan: free
    rootDir: backend/new
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
